name: Build and Release Linux Binary

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install . pyinstaller

      - name: Get version
        id: version
        run: echo "version=$(python -c 'from omniscan import __version__; print(__version__)')" >> $GITHUB_OUTPUT

      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name omniscan \
            --collect-data sherlock_project \
            omniscan/__main__.py

      - name: Smoke test
        run: ./dist/omniscan --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniscan-linux-x86_64
          path: dist/omniscan

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.version.outputs.version }}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Built from commit ${{ github.sha }}" \
            "dist/omniscan#omniscan-linux-x86_64"
